syntax = "proto3";

package apexaegis.v1;

option go_package = "github.com/apexaegis/proto/apexaegis/v1/gen;apexaegisv1";

// DNS security policy + threat-feed sync, pushed from the management plane to
// gateways so they can filter DNS at L7. The per-group policy (category
// allow/deny) travels with the categorized threat-domain set.

// DNSSecurityPolicy is one group's effective policy. When enabled is false the
// gateway must apply no category blocking for the group or its members, and
// categories is empty — the management plane enforces that guard, so a disabled
// dns_security flag can never produce a block.
message DNSSecurityPolicy {
  string group_id = 1;
  bool enabled = 2;
  map<string, string> categories = 3; // category -> "allow" | "deny"
}

// ThreatDomain is a domain and the categories the feed tagged it with
// (nrd, nod, dga, malicious, spyware).
message ThreatDomain {
  string domain = 1;
  repeated string categories = 2;
}

// DNSSecuritySync is the full payload for a gateway: every group's policy plus
// the categorized threat domains. revision lets the gateway skip unchanged
// pushes and enables incremental delivery later.
message DNSSecuritySync {
  string revision = 1;
  repeated DNSSecurityPolicy policies = 2;
  repeated ThreatDomain domains = 3;
}

message GetDNSSecurityRequest {
  string gateway_id = 1;
  string since_revision = 2; // empty requests a full snapshot
}

// ResolveDeviceGroupsRequest asks the management plane for the groups of the
// user bound to a device. The gateway calls this per tunnel session (the
// Zero-Trust PEP resolving authorization from the PDP) so per-group policy uses
// fresh, authoritative membership instead of a static token claim.
message ResolveDeviceGroupsRequest {
  string org_id = 1;
  string device_id = 2; // the device row id (the agent token's device_id claim)
}

message ResolveDeviceGroupsResponse {
  repeated string groups = 1; // group display names; empty if the device is unlinked
}

// DNSSecurityService delivers DNS security policy + feed to gateways.
service DNSSecurityService {
  // GetDNSSecurity returns the current snapshot, or an empty revision-only
  // response when since_revision already matches the latest.
  rpc GetDNSSecurity(GetDNSSecurityRequest) returns (DNSSecuritySync);

  // StreamDNSSecurity pushes a fresh snapshot whenever policy or feed changes.
  rpc StreamDNSSecurity(GetDNSSecurityRequest) returns (stream DNSSecuritySync);

  // ResolveDeviceGroups returns the groups of the user bound to a device, so the
  // gateway can authorize per-group policy per session without trusting a token.
  rpc ResolveDeviceGroups(ResolveDeviceGroupsRequest) returns (ResolveDeviceGroupsResponse);
}

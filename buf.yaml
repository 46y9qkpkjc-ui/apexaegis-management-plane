version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Existing protos predate buf lint; don't fail generation on style.
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
